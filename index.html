<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диагностика API</title>
</head>
<body style="background:#121212; color:#39FF14; font-family:monospace; padding:20px; font-size:14px; word-break: break-all;">
    <h2>Диагностика Gemini API...</h2>
    <div id="output">Ждем ответа от Google...</div>

    <script>
        async function runTest() {
            const out = document.getElementById('output');
            const key = "";
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const text = await res.text();
                
                if (res.ok) {
                    const data = JSON.parse(text);
                    const models = data.models.map(m => m.name).join('<br> • ');
                    out.innerHTML = `✅ <b>УСПЕХ. Доступные модели:</b><br> • ${models}`;
                } else {
                    out.innerHTML = `❌ <b>ОШИБКА СЕРВЕРА (Код ${res.status}):</b><br><br>${text}`;
                }
            } catch(e) {
                out.innerHTML = `❌ <b>СЕТЕВАЯ ОШИБКА:</b><br>${e.message}<br>Убедитесь, что VPN включен.`;
            }
        }
        runTest();
    </script>
</body>
</html>
